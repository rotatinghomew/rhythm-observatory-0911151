[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rhythm-observatory"
version = "0.1.0"
description = "媒体计数器原始时间序列和自然日用量概览"
requires-python = ">=3.11,<3.12"

[tool.unittest]
start-directory = "tests"

[tool.setuptools.packages.find]
include = ["rhythm_observatory*"]
exclude = ["tests*", "tools*", "fixtures*"]
